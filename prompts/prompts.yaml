tools:
  mcp_prompt: |-
    ## *MCP 工具能力说明*

    **MCP（模型上下文协议）**允许你与专用工具互动。这些工具按不同的 **MCP 服务器** 分组，每个服务器都承担特定功能。

    你可以使用以下 MCP 服务器及其工具：

    ```
    {servers}
    ```

    ### 工具使用说明：

    - 分析用户输入，判断是否需要使用工具。
      - 如果**不需要工具**，请忽略整个 MCP 部分，并按照你的人设正常回复。
      - 如果**需要工具**，在说任何其他内容之前先输出 JSON 对象。工具调用必须是独立回复，该回复中只能包含下方所示的 JSON 对象。

    ### JSON 回复格式：
