  image_memory_placeholder: "[用户提供了图片]"
  image_notice: "[用户还提供了图片]"
  image_only_user_input: "[用户提供了图片]"
  interrupted_by_user: "[被用户打断]"
  malformed_tool_result: "错误：结果格式异常"
  mcp_adapter_uninitialized: "[错误：工具适配器未初始化]"
  mcp_construction_error: "[错误：构建 MCP 工具或提示词失败]"
  mcp_no_parameter_description: 未提供参数描述。
  mcp_no_tool_description: 未提供工具描述。
  proactive_speak_fallback: 请说点什么。
  new_chat_created: "[系统事件：这是当前聊天记录中的第一轮对话。]"
  new_chat_browser_time: "[现在时间是：{browser_time}]"
  requested_browser_time: "[现在时间是：{browser_time}。请直接依据该时间回答，不要声称这是服务器时间。]"
  short_relationship_browser_time: "现在时间是：{browser_time}"
