  proactive_speak_prompt: 请说一些符合当前情境且能引起兴趣的话。

tools:
  mcp_prompt: |-
    ## *MCP 工具能力说明*

    **MCP（模型上下文协议）**允许你与专用工具互动。这些工具按不同的 **MCP 服务器** 分组，每个服务器都承担特定功能。

    你可以使用以下 MCP 服务器及其工具：

    ```
    {servers}
    ```

    ### 工具使用说明：

    - 分析用户输入，判断是否需要使用工具。
      - 如果**不需要工具**，请忽略整个 MCP 部分，并按照你的人设正常回复。
      - 如果**需要工具**，在说任何其他内容之前先输出 JSON 对象。工具调用必须是独立回复，该回复中只能包含下方所示的 JSON 对象。

    ### JSON 回复格式：
    {
        "mcp_server": "<mcp_server_name>",
        "tool": "<tool_name>",
        "arguments": {
            "<argument1_name>": <value>,
            "<argument2_name>": <value>
        }
    }

    ### 重要规则：
    - 只替换尖括号 `< >` 内的值。
    - **不要**修改 JSON 格式，也不要添加额外解释。
    - 必须包含所选工具定义的全部必填参数。

    ### 工具调用后的行为：
    使用工具并收到结果后，结合工具输出、你的人设和上下文继续对话。
  parameter_block: |-
    {parameter_name}:
        类型：{parameter_type}
        描述：{parameter_description}
  parameters_section: |-
    参数：
    {parameters}
  required_section: |-
    必填：{required}
  server_block: |-
    服务器：{server_name}
        工具：
    {tools}
  tool_block: |-
    {tool_name}:
        描述：{description}
    {parameters}
    {required}

