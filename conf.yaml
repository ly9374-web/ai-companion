# ===========================
# Open-LLM-VTuber 简化版本 配置文件
# DeepSeek LLM + Qwen TTS + Sherpa-ONNX ASR
# ===========================

system_config:
  conf_version: 'v1.2.1'
  host: 'localhost'
  port: 12393
  config_alts_dir: 'characters'
  tool_prompts:
    mcp_prompt: 'mcp_prompt'
    proactive_speak_prompt: 'proactive_speak_prompt'

character_config:
  conf_name: 'Algernon'
  conf_uid: 'algernon_default_001'
  live2d_model_name: 'Algernon'
  character_name: 'Algernon'
  avatar: 'mao.png'
  human_name: 'Human'

  persona_prompt_file: 'algernon'

  agent_config:
    conversation_agent_choice: 'basic_memory_agent'

    agent_settings:
      basic_memory_agent:
        llm_provider: 'deepseek_llm'
        long_term_summary_model: 'deepseek-v4-pro'
        long_term_reconcile_model: 'deepseek-v4-pro'
        rolling_summary_model: 'deepseek-v4-pro'
        faster_first_response: True
        segment_method: 'pysbd'
        max_history_turns: 8
        use_mcpp: True
        mcp_enabled_servers: ["ddg-search"]

    llm_configs:
      deepseek_llm:
        llm_api_key: ''
        model: 'deepseek-v4-flash'
        temperature: 0.7
      grok_llm:
        base_url: 'https://api.x.ai/v1'
        llm_api_key: ''
        model: 'grok-latest'
        temperature: 0.7

  asr_config:
    asr_model: 'sherpa_onnx_asr'

    sherpa_onnx_asr:
      model_type: 'sense_voice'
      sense_voice: './models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/model.int8.onnx'
      tokens: './models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/tokens.txt'
      num_threads: 4
      use_itn: True
      provider: 'cpu'

  tts_config:
    tts_model: 'qwen_tts'

    qwen_tts:
      api_url: 'https://dashscope.aliyuncs.com/api/v1/services/audio/tts/SpeechSynthesizer'
      api_key: ''
      model: 'qwen-audio-3.0-tts-flash'
      voice: 'qwen-audio-3.0-tts-flash-longyuyaoluan'
      instruction: ''
      sample_rate: 24000
      rate: 1.0
      timeout: 120.0

  vad_config:
    vad_model: null
    # To enable voice interruption, set vad_model: 'silero_vad' and run:
    # uv add torch silero-vad

  tts_preprocessor_config:
    remove_special_char: False
    ignore_brackets: False
    ignore_parentheses: False
    ignore_asterisks: False
    ignore_angle_brackets: False
    translator_config:
      translate_audio: False

live_config:
  bilibili_live:
    room_ids: []
    sessdata: ''
